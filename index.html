<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>SMC Prop Firm | Trade our capital, keep your profits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#ffffff;--bg2:#f6f3ff;--card:#ffffff;--card2:#efe9ff;--bd:#e5dff7;
  --tx:#1a1433;--mut:#6a6490;--p:#7c4dff;--p2:#6a3ae8;--soft:rgba(124,77,255,.10);
  --ok:#0f9d76;--warn:#b7791f;--bad:#e0405a;--glow:rgba(124,77,255,.28);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,.logo,.num-lg{font-family:'Sora','Manrope',sans-serif}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.ico{width:1.2em;height:1.2em;vertical-align:-.17em;display:inline-block}
.wrap{max-width:1200px;margin:0 auto;padding:0 5%}
.hidden{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:10px;font-weight:700;font-size:.95rem;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .15s,background .15s,border-color .15s}
.btn-p{background:var(--p);color:#fff;box-shadow:0 8px 24px var(--glow)}
.btn-p:hover{background:var(--p2);transform:translateY(-1px)}
.btn-g{background:transparent;color:var(--tx);border-color:var(--bd)}
.btn-g:hover{border-color:var(--p);color:var(--p)}
.btn-sm{padding:8px 16px;font-size:.85rem;border-radius:8px}
.btn[disabled]{opacity:.6;cursor:wait}

/* promo + header */
.promo{background:linear-gradient(90deg,#6a3ae8,#9b7bff);text-align:center;padding:8px 16px;font-size:.85rem;font-weight:600}
header.site{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.3rem;text-decoration:none;white-space:nowrap}
.logo em{font-style:normal;color:var(--p)}
.nav{display:flex;gap:28px;list-style:none}
.nav a{text-decoration:none;color:var(--mut);font-weight:600;font-size:.93rem;transition:color .15s}
.nav a:hover{color:var(--p)}
.hdr-actions{display:flex;align-items:center;gap:12px}
.hdr-user{font-size:.85rem;color:var(--mut);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-btn{background:none;border:none;color:var(--tx);font-weight:700;font-size:.93rem;cursor:pointer}
.link-btn:hover{color:var(--p)}

/* hero */
.hero{padding:84px 0 70px;background:radial-gradient(900px 420px at 80% -10%,rgba(124,77,255,.16),transparent 70%),linear-gradient(180deg,#faf8ff,#ffffff)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.pill{display:inline-block;background:var(--soft);color:var(--p);font-weight:700;font-size:.82rem;padding:6px 14px;border-radius:999px;margin-bottom:20px;border:1px solid rgba(124,92,255,.35)}
.hero h1{font-size:3.5rem;line-height:1.08;font-weight:800;letter-spacing:-.02em;margin-bottom:20px}
.hero p.lead{color:var(--mut);font-size:1.1rem;max-width:520px;margin-bottom:30px}
.hero .btns{display:flex;gap:12px;flex-wrap:wrap}
.hero-points{display:flex;gap:22px;flex-wrap:wrap;margin-top:30px;color:var(--mut);font-size:.88rem;font-weight:600}
.hero-points span{display:flex;align-items:center;gap:8px}
.hero-points .ico{color:var(--ok)}
.acct-card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--bd);border-radius:20px;padding:26px;box-shadow:0 24px 60px rgba(76,29,149,.14)}
.acct-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.acct-top b{font-size:.95rem}
.tag{font-size:.72rem;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--p)}
.tag.ok{background:rgba(15,157,118,.12);color:var(--ok)}
.tag.warn{background:rgba(183,121,31,.12);color:var(--warn)}
.tag.bad{background:rgba(224,64,90,.12);color:var(--bad)}
.acct-size{font-family:'Sora';font-size:2.6rem;font-weight:800;margin-bottom:4px}
.acct-sub{color:var(--mut);font-size:.88rem;margin-bottom:22px}
.bar{height:8px;background:#e9e3fb;border-radius:99px;overflow:hidden;margin:8px 0 18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--ok));border-radius:99px}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--bd);font-size:.92rem;color:var(--mut)}
.kv b{color:var(--tx)}

/* stats */
.stats{background:var(--bg2);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.stats .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding-top:34px;padding-bottom:34px;text-align:center}
.stats b{display:block;font-family:'Sora';font-size:2rem;font-weight:800}
.stats span{font-size:.88rem;color:var(--mut)}

/* sections */
section.s{padding:90px 0}
section.alt{background:var(--bg2);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.sec-title{text-align:center;max-width:640px;margin:0 auto 46px}
.sec-title h2{font-size:2.4rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.sec-title p{color:var(--mut);margin-top:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px}
.box .ic{width:46px;height:46px;border-radius:12px;background:var(--soft);color:var(--p);display:flex;align-items:center;justify-content:center;margin-bottom:16px;font-size:1.3rem}
.box h3{font-size:1.1rem;margin-bottom:8px}
.box p{color:var(--mut);font-size:.94rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;position:relative}
.step{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:26px}
.step .n{width:38px;height:38px;border-radius:50%;background:var(--p);display:flex;align-items:center;justify-content:center;font-weight:800;margin-bottom:14px}
.step h3{font-size:1.05rem;margin-bottom:6px}
.step p{color:var(--mut);font-size:.9rem}

/* picker */
.picker{max-width:1100px;margin:0 auto}
.prog-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:14px}
.prog{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px 22px;text-align:left;cursor:pointer;color:var(--tx);transition:border-color .15s,background .15s}
.prog:hover{border-color:#b9a3ff}
.prog.on{border-color:var(--p);background:linear-gradient(160deg,#f1ebff,#faf8ff);box-shadow:0 0 0 1px var(--p)}
.prog b{display:block;font-family:'Sora';font-size:1.25rem;margin-bottom:6px}
.prog span{color:var(--mut);font-size:.85rem}
.size-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.size{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 20px;text-align:left;cursor:pointer;color:var(--tx);position:relative;transition:border-color .15s}
.size:hover{border-color:#b9a3ff}
.size.on{border-color:var(--p);background:linear-gradient(160deg,#f1ebff,#faf8ff);box-shadow:0 0 0 1px var(--p)}
.size small{display:block;color:var(--mut);font-size:.78rem;font-weight:600}
.size .big{display:block;font-family:'Sora';font-size:1.9rem;font-weight:800;line-height:1.2;margin:2px 0 8px}
.size .big sup{font-size:.9rem;font-weight:700;margin-right:2px;vertical-align:top;position:relative;top:.35em}
.size .pc{color:var(--ok);font-weight:800;font-size:.95rem}
.size i{position:absolute;top:10px;right:12px;background:var(--ok);color:#06231b;font-size:.62rem;font-style:normal;font-weight:800;padding:2px 7px;border-radius:5px}
.detail{background:linear-gradient(160deg,#f6f2ff,#ffffff);border:1px solid var(--bd);border-radius:18px;padding:22px}
.dtools{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:18px;font-weight:600;font-size:.92rem}
.switch{display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--tx);font-weight:700;font-size:.92rem;cursor:pointer}
.switch .tr{width:34px;height:20px;border-radius:99px;background:#cdc3ee;position:relative;transition:background .15s}
.switch .tr::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.switch.on .tr{background:var(--p)}
.switch.on .tr::after{transform:translateX(14px)}
.dgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.rbox{background:rgba(255,255,255,.85);border:1px solid var(--bd);border-radius:14px;padding:20px 22px}
.rbox h4{font-size:.88rem;color:var(--mut);font-weight:600;margin-bottom:12px}
.rl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;font-size:.9rem}
.rl span{display:flex;align-items:center;gap:10px;color:var(--mut)}
.rl span .ico{width:1em;height:1em;opacity:.7}
.rl b{font-weight:600;color:var(--tx);text-align:right}
.sumbox{padding:6px 4px 0}
.sumbox h3{font-size:1.1rem;margin-bottom:6px}
.sumbox .pr{font-family:'Sora';font-size:2rem;font-weight:800;color:var(--ok);margin-bottom:16px}
.sumbox .ql{font-size:.78rem;color:var(--mut);font-weight:700;letter-spacing:.04em;margin-bottom:10px}
.sumbox .item{display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:6px 0}
.sumbox .item span{display:flex;align-items:center;gap:10px}
.sumbox .item .ico{color:var(--ok)}
.sumbox .btn{width:100%;margin:16px 0 14px;padding:15px}
.sumbox .code{font-size:.82rem;color:var(--mut);margin-bottom:14px}
.sumbox .code b{color:var(--p)}
.pays{display:flex;gap:8px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--bd)}
.pays span{background:#efeafd;border-radius:6px;padding:6px 10px;font-size:.78rem;font-weight:700;color:var(--mut)}
@media(max-width:1000px){.dgrid{grid-template-columns:1fr 1fr}.sumbox{grid-column:1/-1}.size-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.dgrid{grid-template-columns:1fr}.size .big{font-size:1.5rem}}

/* compare table */
.cmp{max-width:820px;margin:0 auto;border:1px solid var(--bd);border-radius:16px;overflow:hidden;background:var(--card)}
.cmp .r{display:grid;grid-template-columns:1.2fr 1fr 1fr;padding:14px 22px;border-top:1px solid var(--bd);font-size:.94rem}
.cmp .r:first-child{border-top:none;background:var(--card2);font-weight:800}
.cmp .r span:first-child{color:var(--mut)}
.cmp-scroll{overflow-x:auto}

/* faq */
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px 22px;margin-bottom:12px}
summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';color:var(--p);font-size:1.3rem;line-height:1}
details[open] summary::after{content:'\2212'}
details p{color:var(--mut);margin-top:12px;font-size:.94rem}

/* cta + footer */
.cta{background:linear-gradient(135deg,#6a3ae8,#9b7bff);border-radius:24px;padding:56px 28px;text-align:center}
.cta h2{font-size:2.2rem;font-weight:800;margin-bottom:10px}
.cta p{opacity:.85;margin-bottom:24px}
.cta .btn{background:#fff;color:#4c2bb8}
footer.site{border-top:1px solid var(--bd);padding:44px 0;color:var(--mut);font-size:.85rem}
footer.site .wrap{display:flex;flex-direction:column;gap:14px}
.foot-links{display:flex;gap:22px;flex-wrap:wrap}
.foot-links a{text-decoration:none}
.foot-links a:hover{color:var(--p)}
.risk{font-size:.78rem;opacity:.75;max-width:900px}

/* auth + payment modals */
.overlay{position:fixed;inset:0;background:rgba(40,25,80,.45);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
.overlay.active{display:flex}
.modal{background:var(--card);border:1px solid var(--bd);border-radius:20px;width:100%;max-width:420px;padding:32px;position:relative;max-height:92vh;overflow-y:auto}
.modal .x{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--mut);cursor:pointer;font-size:1.2rem}
.modal h3{font-size:1.4rem;margin-bottom:6px}
.modal .sub{color:var(--mut);font-size:.9rem;margin-bottom:20px}
.field{margin-bottom:14px;text-align:left}
.field label{display:block;font-size:.82rem;font-weight:700;margin-bottom:6px;color:var(--mut)}
.in{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:.95rem;font-family:inherit;outline:none}
.in:focus{border-color:var(--p)}
.msg{display:none;padding:10px 14px;border-radius:8px;font-size:.86rem;margin-bottom:14px;text-align:left}
.msg.err{background:rgba(224,64,90,.10);color:var(--bad)}
.msg.okm{background:rgba(15,157,118,.10);color:var(--ok)}
.auth-row{display:flex;justify-content:flex-end;margin-bottom:16px}
.auth-row a{color:var(--p);font-size:.85rem;font-weight:600;cursor:pointer;text-decoration:none}
.auth-switch{text-align:center;margin-top:20px;font-size:.9rem;color:var(--mut)}
.auth-switch a{color:var(--p);font-weight:700;cursor:pointer;text-decoration:none}
.pay{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;text-decoration:none;font-weight:700;margin-top:12px}
.pay:hover{border-color:var(--p)}

/* dashboard */
.dapp{min-height:100vh;background:var(--bg2)}
.dbar{position:sticky;top:0;z-index:300;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;height:64px;padding:0 22px;background:#fff;border-bottom:1px solid var(--bd)}
.dbar .l{display:flex;align-items:center;gap:12px}
.dbar .r{display:flex;justify-content:flex-end;align-items:center;gap:12px}
.menu-btn{display:none;background:var(--bg2);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:8px 10px;cursor:pointer}
.avwrap{position:relative}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--p);color:#fff;border:none;font-weight:800;cursor:pointer}
.avmenu{display:none;position:absolute;right:0;top:46px;min-width:220px;background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:0 16px 40px rgba(76,29,149,.16);padding:8px;z-index:400}
.avmenu.open{display:block}
.avmenu .avemail{padding:8px 10px;font-size:.82rem;color:var(--mut);border-bottom:1px solid var(--bd);margin-bottom:6px;word-break:break-all}
.avmenu a{display:block;padding:9px 10px;border-radius:8px;text-decoration:none;font-weight:600;font-size:.9rem}
.avmenu a:hover{background:var(--soft);color:var(--p)}
.dlay{display:grid;grid-template-columns:240px 1fr;gap:0;align-items:start}
.side{position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:4px}
.side .lab{font-size:.72rem;font-weight:700;color:var(--mut);letter-spacing:.06em;padding:4px 12px 10px}
.side a.nl{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--mut);text-decoration:none;font-weight:600;font-size:.92rem}
.side a.nl:hover{background:#fff;color:var(--tx)}
.side a.nl.on{background:var(--soft);color:var(--p)}
.side a.nl.sub{padding-left:46px;font-size:.88rem}
.side a.nl .car{margin-left:auto;font-size:.8rem}
.side .sep{height:14px}
.side .grow{flex:1}
.side .promo-m{border:1px solid var(--bd);background:#fff;border-radius:12px;padding:14px;font-size:.82rem;color:var(--mut)}
.side .promo-m b{display:block;color:var(--tx);font-size:.95rem;margin-bottom:2px}
.dmain{background:#fff;border:1px solid var(--bd);border-radius:20px;margin:0 22px 22px 0;padding:26px 28px 40px;min-height:calc(100vh - 86px);min-width:0}
.acc-grid{display:grid;grid-template-columns:1fr 300px;gap:24px}
.ttabs{border-bottom:1px solid var(--bd);margin-bottom:18px;display:flex;gap:6px}
.tt{padding:10px 14px;font-weight:700;font-size:.92rem;color:var(--mut)}
.tt.on{color:var(--p);border-bottom:2px solid var(--p);margin-bottom:-1px}
.filters{display:flex;gap:8px;margin-bottom:16px}
.fp{border:1px solid var(--bd);background:#fff;color:var(--mut);padding:7px 16px;border-radius:8px;font-weight:700;font-size:.85rem;cursor:pointer}
.fp.on{background:var(--p);border-color:var(--p);color:#fff}
.empty-wrap{background:var(--bg2);border-radius:16px;padding:10px;margin-bottom:26px}
.rec-h{font-size:1.05rem;margin-bottom:14px}
.plan-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.plan{border:1px solid var(--bd);border-radius:16px;padding:20px;background:#fff;display:flex;flex-direction:column}
.plan h4{font-family:'Sora';font-size:1.05rem;margin-bottom:4px}
.plan .sz{color:var(--mut);font-size:.85rem;margin-bottom:14px}
.plan .get{background:var(--soft);color:var(--p);border:none;border-radius:10px;padding:12px;font-weight:800;font-size:.9rem;cursor:pointer;margin-bottom:16px}
.plan .get:hover{background:var(--p);color:#fff}
.plan ul{list-style:none;display:flex;flex-direction:column;gap:9px;font-size:.84rem;color:var(--mut)}
.plan li{display:flex;gap:9px;align-items:flex-start}
.plan li .ico{color:var(--ok);margin-top:3px;flex-shrink:0}
.acc-side{display:flex;flex-direction:column;gap:16px}
.rcard{border:1px solid var(--bd);border-radius:16px;padding:18px;background:#fff}
.rcard h4{font-size:.95rem;margin-bottom:12px}
.promo-card{background:linear-gradient(135deg,#6a3ae8,#a48bff);color:#fff;border:none}
.promo-card h4{font-family:'Sora';font-size:1.2rem;line-height:1.25;margin-bottom:14px}
.promo-card .code{display:inline-block;background:rgba(255,255,255,.2);border-radius:8px;padding:6px 12px;font-weight:800;font-size:.85rem;margin-bottom:12px}
.promo-card a{display:block;color:#fff;font-weight:700;font-size:.85rem;text-decoration:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px}
.week .wd span{display:block;font-size:.62rem;font-weight:700;color:var(--mut)}
.week .wd b{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;border-radius:50%;font-size:.88rem;margin-top:4px}
.week .wd b.td{background:var(--p);color:#fff}
.calc-ico{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.calc-ico a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:12px;background:var(--bg2);text-decoration:none;font-size:.8rem;font-weight:700;color:var(--tx)}
.calc-ico a:hover{background:var(--soft);color:var(--p)}
.calc-ico .ico{font-size:1.4rem;color:var(--p)}
.stabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--bd);margin-bottom:22px}
.st{background:none;border:none;border-bottom:2px solid transparent;text-align:left;padding:6px 18px 14px;cursor:pointer;color:var(--mut)}
.st span{display:block;font-size:.85rem;font-weight:600}
.st b{display:block;font-family:'Sora';font-size:1.5rem;color:var(--tx);margin-top:2px}
.st.on{border-bottom-color:var(--p)}
.st.on span{color:var(--tx)}
.banner{border-radius:18px;padding:34px;background:linear-gradient(120deg,#efe9ff,#dccfff);margin-bottom:20px}
.banner h2{font-size:1.5rem;margin-bottom:6px}
.banner p{color:var(--mut)}
.ctabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--bd);margin-bottom:20px}
.ctabs span{padding:10px 14px;font-size:.88rem;font-weight:700;color:var(--mut)}
.ctabs span.on{color:var(--p);border-bottom:2px solid var(--p);margin-bottom:-1px}
.ctabs em{font-style:normal;background:var(--bg2);border-radius:99px;padding:1px 8px;font-size:.75rem;margin-left:4px}
.offer{max-width:360px;border:1px solid var(--bd);border-radius:16px;overflow:hidden;background:#fff}
.offer .top{background:linear-gradient(135deg,#6a3ae8,#a48bff);color:#fff;padding:20px}
.offer .top h3{font-family:'Sora';font-size:1.2rem;margin-bottom:6px}
.offer .top p{font-size:.88rem;opacity:.92}
.offer .bot{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;gap:10px}
.offer .bot b{font-family:'Sora'}
.page-h{font-size:1.3rem;margin-bottom:4px}
.page-s{color:var(--mut);font-size:.9rem;margin-bottom:20px}
.accts{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;padding:6px}
.empty{text-align:center;padding:44px 16px;color:var(--mut)}
.empty .ei{width:54px;height:54px;border-radius:16px;background:var(--soft);color:var(--p);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:1.5rem}
.empty h3{color:var(--tx);font-size:1.05rem;margin-bottom:6px}
.empty p{font-size:.9rem;max-width:400px;margin:0 auto 18px}
.panel{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:22px;margin-bottom:20px}
.panel h2{font-size:1.05rem;margin-bottom:14px}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;color:var(--mut);font-weight:700;font-size:.8rem;padding:10px 12px;border-bottom:1px solid var(--bd)}
.tbl td{padding:13px 12px;border-bottom:1px solid var(--bd)}
.tbl-wrap{overflow-x:auto}
.rule-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.rule{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:18px}
.rule b{display:block;font-family:'Sora';font-size:1.5rem;margin-bottom:2px}
.rule span{color:var(--mut);font-size:.85rem}
.calc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.calc-out{background:var(--bg2);border-radius:12px;padding:16px;margin-top:6px;font-size:.92rem;color:var(--mut)}
.calc-out b{display:block;font-family:'Sora';font-size:1.6rem;color:var(--tx)}
.scrim{display:none}


/* checkout */
.co{min-height:100vh;background:var(--bg2)}
.co-bar{display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 22px;background:#fff;border-bottom:1px solid var(--bd)}
.co-wrap{max-width:1040px;margin:0 auto;padding:32px 22px 60px;display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:start}
.co h1{font-size:1.6rem;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.co h1 a{color:var(--mut);text-decoration:none;font-size:1.3rem}
.co .sec-l{font-weight:700;margin:22px 0 12px;font-size:.95rem}
.methods{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.method{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:22px 16px 16px;text-align:center;cursor:pointer;color:var(--tx);font-family:inherit;transition:border-color .15s}
.method:hover{border-color:#b9a3ff}
.method.on{border-color:var(--p);box-shadow:0 0 0 1px var(--p);background:linear-gradient(160deg,#f1ebff,#fff)}
.method[disabled]{opacity:.5;cursor:not-allowed}
.method .mi{font-size:2rem;color:var(--p);height:46px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.method b{display:block;font-size:.95rem;border-top:1px solid var(--bd);padding-top:12px}
.method small{display:block;color:var(--mut);font-size:.75rem;margin-top:2px}
.osum{background:#fff;border:1px solid var(--bd);border-radius:18px;overflow:hidden;position:sticky;top:20px}
.osum .hd{background:linear-gradient(135deg,#6a3ae8,#9b7bff);color:#fff;padding:20px 22px}
.osum .hd h3{font-family:'Sora';font-size:1.15rem;margin-bottom:4px}
.osum .hd div{font-size:.88rem;opacity:.92}
.osum .bd{padding:18px 22px}
.osum .rw{display:flex;justify-content:space-between;padding:8px 0;font-size:.9rem;color:var(--mut)}
.osum .rw b{color:var(--tx)}
.osum .tot{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--bd);margin-top:8px;padding-top:14px;font-weight:700}
.osum .tot b{font-family:'Sora';font-size:1.6rem}
.osum .agree{display:flex;gap:10px;align-items:flex-start;font-size:.8rem;color:var(--mut);margin:16px 0}
.osum .agree input{margin-top:3px;accent-color:var(--p)}
.osum .btn{width:100%;padding:14px}
.osum .note{font-size:.78rem;color:var(--mut);margin-top:12px}
@media(max-width:860px){.co-wrap{grid-template-columns:1fr}.osum{position:static}}

@media(max-width:960px){
  .hero .wrap{grid-template-columns:1fr}
  .hero h1{font-size:2.6rem}
  .steps{grid-template-columns:repeat(2,1fr)}
  .nav{display:none}
}
@media(max-width:1100px){.acc-grid{grid-template-columns:1fr}}
@media(max-width:820px){
  .dlay{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;height:auto;background:#fff;z-index:900;transform:translateX(-100%);transition:transform .2s;padding-top:20px}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(40,25,80,.45);z-index:850}
  .menu-btn{display:inline-block}
  .dmain{margin:0 12px 16px;padding:20px 16px 40px;border-radius:16px}
  .dbar{padding:0 14px;grid-template-columns:auto 1fr auto}
  .stabs{grid-template-columns:1fr}
  .st{padding-left:6px}
}
@media(max-width:640px){
  .dbar>.btn{display:none}
  .dbar{grid-template-columns:1fr auto}
  .stats .wrap{grid-template-columns:repeat(2,1fr)}
  .sel{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  .sec-title h2{font-size:1.8rem}
  .cmp .r{padding:12px 14px;font-size:.85rem}
  .hdr-user{display:none}
  section.s{padding:60px 0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<script>
/* ============ SETTINGS ============ */
const SUPABASE_URL = 'https://dofncwwlubzllglwpkrr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_4oSYI75c5v1IwYiatvBaTQ_PslS9lq9';
/* One Stripe Payment Link PER account (each link must contain only that one product).
   Paste the link for each plan + size. Empty = card payment is hidden for that account. */
const STRIPE_LINKS = {
  'challenge-2000':'',  'challenge-5000':'',  'challenge-10000':'',  'challenge-15000':'',
  'challenge-50000':'', 'challenge-100000':'','challenge-150000':'', 'challenge-200000':'',
  'instant-2000':'',    'instant-5000':'',    'instant-10000':'',    'instant-15000':'',
  'instant-50000':'',   'instant-100000':'',  'instant-150000':'',   'instant-200000':''
};
const NOW = 'https://nowpayments.io/payment/?iid=';
const PROMO = 'SMC10';
/* Optional Supabase tables read by the dashboard (empty state shows if they do not exist):
   accounts: id, user_id, plan ('challenge'|'instant'), size (number), balance (number),
             status ('active'|'passed'|'funded'|'breached'), phase (text), profit_target_pct (number), created_at
   payouts:  id, user_id, amount (number), method (text), status ('pending'|'paid'|'rejected'), created_at */
/* ================================ */

const PLANS = {
  challenge: { label:'Evaluation Challenge', sub:'2 phases | 8% then 5% profit targets', cta:'Start Challenge', name:'Challenge',
    left:{ title:'Challenge Rules', rows:[['Phase 1 Profit Target',8],['Phase 2 Profit Target',5],['Daily Loss Limit',5],['Maximum Loss Limit',10],['Platform','cTrader']] },
    right:{ title:'Funded Account Rules', rows:[['Daily Loss Limit',5],['Maximum Loss Limit',10],['Platform','cTrader']] },
    sizes:[['$2,000','$29','4398622033'],['$5,000','$59','4398622033'],['$10,000','$99','4398622033'],['$15,000','$139','4398622033'],['$50,000','$299','5163043336'],['$100,000','$499','5724610520'],['$150,000','$679','5724610520'],['$200,000','$899','5724610520']], popular:4 },
  instant: { label:'Instant Funding', sub:'No evaluation | 80% profit split', cta:'Buy Instant', name:'Instant',
    left:{ title:'Account Rules', rows:[['Evaluation','None'],['Daily Loss Limit',5],['Maximum Loss Limit',10],['Platform','cTrader']] },
    right:{ title:'Funded & Reward Rules', rows:[['Daily Loss Limit',5],['Maximum Loss Limit',10],['Reward Share','80%'],['Platform','cTrader']] },
    sizes:[['$2,000','$49','5320986875'],['$5,000','$89','5320986875'],['$10,000','$149','5320986875'],['$15,000','$199','5320986875'],['$50,000','$399','6114767314'],['$100,000','$699','6165027996'],['$150,000','$999','6165027996'],['$200,000','$1,299','6165027996']], popular:-1 }
};

let sb = null, user = null, isSignUp = false;
let pending = null;                 // {name, stripe, crypto}
const pick = {};                    // picker state per context
let data = { accounts: [], payouts: [], loaded: false };

try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) { console.error('Supabase failed to load', e); }

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico = (n, extra) => '<svg class="ico"' + (extra ? ' style="' + extra + '"' : '') + '><use href="#i-' + n + '"/></svg>';
const money = n => '$' + Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });

/* ---------- TEMPLATES ---------- */
function pickerHTML(ctx) {
  return '<div class="picker">' +
    '<div class="prog-row">' + Object.keys(PLANS).map(k => '<button class="prog" id="' + ctx + '-tab-' + k + '" onclick="setType(\'' + ctx + '\',\'' + k + '\')"><b>' + PLANS[k].label + '</b><span>' + PLANS[k].sub + '</span></button>').join('') + '</div>' +
    '<div class="size-row" id="' + ctx + '-chips"></div>' +
    '<div class="detail"><div class="dtools"><button class="switch on" id="' + ctx + '-pct" onclick="togglePct(\'' + ctx + '\')"><span class="tr"></span>Show Percentage</button></div>' +
    '<div class="dgrid"><div class="rbox" id="' + ctx + '-left"></div><div class="rbox" id="' + ctx + '-right"></div>' +
    '<div class="sumbox"><h3 id="' + ctx + '-title"></h3><div class="pr" id="' + ctx + '-price"></div><div class="ql">QUANTITY</div>' +
    '<div class="item"><span>' + ico('check') + '1st account</span><b id="' + ctx + '-price2"></b></div>' +
    '<button class="btn btn-p" id="' + ctx + '-btn">Start</button><div class="code">Use code <b>' + PROMO + '</b> for 10% off new users</div>' +
    '<div class="pays"><span>Card (Stripe)</span><span>Crypto (NOWPayments)</span></div></div></div></div></div>';
}
function setType(ctx, t) { const pct = pick[ctx] ? pick[ctx].pct : true; pick[ctx] = { type: t, idx: PLANS[t].popular >= 0 ? PLANS[t].popular : 2, pct }; renderPicker(ctx); }
function setSize(ctx, i) { pick[ctx].idx = i; renderPicker(ctx); }
function togglePct(ctx) { pick[ctx].pct = !pick[ctx].pct; renderPicker(ctx); }
function sizeNum(label) { return Number(label.replace(/[^0-9]/g, '')); }
function sizeShort(n) { return n >= 1000 ? (n / 1000) + 'K' : String(n); }
function ruleBox(box, size, showPct) {
  return '<h4>' + box.title + '</h4>' + box.rows.map(r => {
    const v = typeof r[1] === 'number' ? (showPct ? r[1] + '%' : money(size * r[1] / 100)) : r[1];
    return '<div class="rl"><span>' + ico('info') + r[0] + '</span><b>' + v + '</b></div>';
  }).join('');
}
function renderPicker(ctx) {
  if (!$(ctx + '-chips')) return;
  if (!pick[ctx]) pick[ctx] = { type: 'challenge', idx: PLANS.challenge.popular, pct: true };
  const st = pick[ctx], p = PLANS[st.type], s = p.sizes[st.idx], n = sizeNum(s[0]);
  Object.keys(PLANS).forEach(k => { $(ctx + '-tab-' + k).className = 'prog' + (k === st.type ? ' on' : ''); });
  $(ctx + '-chips').innerHTML = p.sizes.map((x, i) =>
    '<button class="size' + (i === st.idx ? ' on' : '') + '" onclick="setSize(\'' + ctx + '\',' + i + ')">' + (i === p.popular ? '<i>Popular</i>' : '') +
    '<small>Account</small><span class="big"><sup>$</sup>' + sizeShort(sizeNum(x[0])) + '</span><span class="pc">' + x[1] + '</span></button>').join('');
  $(ctx + '-pct').className = 'switch' + (st.pct ? ' on' : '');
  $(ctx + '-left').innerHTML = ruleBox(p.left, n, st.pct);
  $(ctx + '-right').innerHTML = ruleBox(p.right, n, st.pct);
  $(ctx + '-title').textContent = p.name + ' ' + '$' + sizeShort(n);
  $(ctx + '-price').textContent = s[1];
  $(ctx + '-price2').textContent = s[1];
  const b = $(ctx + '-btn'); b.textContent = p.cta;
  b.onclick = () => checkout(s[0] + ' ' + p.name, STRIPE_LINKS[st.type + '-' + n] || '', NOW + s[2], { label: p.label, size: s[0], price: s[1] });
}

function siteHeader() {
  return '<div class="promo">Use code <strong>' + PROMO + '</strong> for 10% off new users and 5% off existing users</div>' +
  '<header class="site"><div class="wrap">' +
    '<a class="logo" href="#/">' + ico('chart', 'color:var(--p)') + 'SMC<em>PROPFIRM</em></a>' +
    '<ul class="nav"><li><a href="#/" onclick="goSec(\'challenges\',\'challenge\');return false">Challenges</a></li><li><a href="#/" onclick="goSec(\'challenges\',\'instant\');return false">Instant Funding</a></li><li><a href="#/" onclick="goSec(\'how\');return false">How it works</a></li><li><a href="#/" onclick="goSec(\'rules\');return false">Rules</a></li><li><a href="#/" onclick="goSec(\'faq\');return false">FAQ</a></li></ul>' +
    '<div class="hdr-actions" id="hdrActions"></div>' +
  '</div></header>';
}
function renderHdr() {
  const el = $('hdrActions'); if (!el) return;
  if (user) {
    el.innerHTML = '<span class="hdr-user">' + esc(user.email) + '</span><a class="btn btn-p btn-sm" href="#/dashboard">Dashboard</a>';
  } else {
    el.innerHTML = '<button class="link-btn" onclick="openAuth(false)">Sign in</button><a class="btn btn-p btn-sm" href="#/" onclick="goSec(\'challenges\');return false">Get funded</a>';
  }
}

function homeHTML() {
  return siteHeader() +
  '<section class="hero"><div class="wrap"><div>' +
    '<span class="pill">Trade our capital. Keep your profits.</span>' +
    '<h1>Get funded up to $200K and trade on your terms</h1>' +
    '<p class="lead">Trade in a fully simulated environment with raw spreads on cTrader. Pass the evaluation, or skip it with Instant Funding.</p>' +
    '<div class="btns"><a class="btn btn-p" href="#/" onclick="goSec(\'challenges\');return false">Start your challenge</a><a class="btn btn-g" href="#/" onclick="goSec(\'how\');return false">How it works</a></div>' +
    '<div class="hero-points"><span>' + ico('check') + 'No time limit on the evaluation</span><span>' + ico('check') + '80% profit split on Instant</span><span>' + ico('check') + 'Raw spreads on cTrader</span></div>' +
  '</div>' +

    return '<h2 class="page-h">Trading rules</h2><p class="page-s">Stay inside these limits on every account.</p>' +
      '<div class="panel"><h2>Loss limits (all accounts)</h2><div class="rule-grid"><div class="rule"><b>5%</b><span>Daily loss limit</span></div><div class="rule"><b>10%</b><span>Max loss limit</span></div></div></div>' +
      '<div class="panel"><h2>Evaluation Challenge</h2><div class="rule-grid"><div class="rule"><b>8%</b><span>Phase 1 profit target</span></div><div class="rule"><b>5%</b><span>Phase 2 profit target</span></div><div class="rule"><b>cTrader</b><span>Platform</span></div></div></div>' +
      '<div class="panel"><h2>Instant Funding</h2><div class="rule-grid"><div class="rule"><b>None</b><span>Evaluation</span></div><div class="rule"><b>80%</b><span>Profit split</span></div><div class="rule"><b>cTrader</b><span>Platform</span></div></div></div>';
  }
  if (page === 'settings') {
    return '<h2 class="page-h">Settings</h2><p class="page-s">Manage your login details.</p><div class="panel" style="max-width:520px">' +
      '<div class="field"><label>Email address</label><input class="in" value="' + esc(user.email) + '" disabled></div>' +
      '<div class="msg err" id="pwErr"></div><div class="msg okm" id="pwOk"></div>' +
      '<div class="field"><label for="newPw">New password</label><input type="password" id="newPw" class="in" placeholder="At least 6 characters" autocomplete="new-password"></div>' +
      '<button class="btn btn-p btn-sm" onclick="changePw()">Update password</button></div>';
  }
  return '';
}

async function loadData() {
  data = { accounts: [], payouts: [], loaded: true };
  if (!sb || !user) return;
  try {
    const a = await sb.from('accounts').select('*').eq('user_id', user.id).order('created_at', { ascending: false });
    if (!a.error && a.data) data.accounts = a.data;
  } catch (e) {}
  try {
    const p = await sb.from('payouts').select('*').eq('user_id', user.id).order('created_at', { ascending: false });
    if (!p.error && p.data) data.payouts = p.data;
  } catch (e) {}
}

async function changePw() {
  const pw = $('newPw').value, er = $('pwErr'), ok = $('pwOk');
  er.style.display = ok.style.display = 'none';
  if (pw.length < 6) { er.textContent = 'Password must be at least 6 characters.'; er.style.display = 'block'; return; }
  const { error } = await sb.auth.updateUser({ password: pw });
  if (error) { er.textContent = error.message; er.style.display = 'block'; }
  else { ok.textContent = 'Password updated.'; ok.style.display = 'block'; $('newPw').value = ''; }
}

/* ---------- CHECKOUT ---------- */
let coMethod = '';
function checkoutHTML() {
  const m = pending.meta || {};
  const hasCard = !!pending.stripe;
  const card = '<button class="method' + (coMethod === 'card' ? ' on' : '') + '"' + (hasCard ? '' : ' disabled') + ' onclick="setMethod(\'card\')"><div class="mi">' + ico('wallet') + '</div><b>Card</b><small>' + (hasCard ? 'Secure page by Stripe' : 'Not available for this account yet') + '</small></button>';
  const cry = '<button class="method' + (coMethod === 'crypto' ? ' on' : '') + '" onclick="setMethod(\'crypto\')"><div class="mi">' + ico('coin') + '</div><b>Crypto</b><small>Via NOWPayments</small></button>';
  return '<div class="co"><div class="co-bar"><a class="logo" href="#/">' + ico('chart', 'color:var(--p)') + 'SMC<em>PROPFIRM</em></a><a class="btn btn-g btn-sm" href="#/dashboard/accounts">Dashboard</a></div>' +
    '<div class="co-wrap"><div><h1><a href="#/" onclick="history.length>1?history.back():(location.hash=\'#/\');return false" aria-label="Back">&lsaquo;</a>Payments</h1>' +
    '<div class="sec-l">Choose how to pay</div><div class="methods">' + card + cry + '</div>' +
    '<p id="coMsg" class="msg okm" style="margin-top:20px"></p></div>' +
    '<aside class="osum"><div class="hd"><h3>' + esc(pending.name) + '</h3><div>' + esc(m.label || '') + '</div><div>Account size: ' + esc(m.size || '') + '</div></div>' +
    '<div class="bd"><div class="rw"><span>1 account</span><b>' + esc(m.price || '') + '</b></div><div class="rw"><span>Trading platform</span><b>cTrader</b></div><div class="rw"><span>Daily / max loss</span><b>5% / 10%</b></div>' +
    '<div class="tot"><span>Total</span><b>' + esc(m.price || '') + '</b></div>' +
    '<label class="agree"><input type="checkbox" id="coAgree" onchange="updateCo()"><span>I agree to the Terms of Service and the challenge rules.</span></label>' +
    '<button class="btn btn-p" id="coGo" onclick="goPay()" disabled>Continue</button>' +
    '<p class="note">Discount codes such as ' + PROMO + ' are entered on the card payment page.</p></div></aside></div></div>';
}
function setMethod(k) { coMethod = k; document.querySelectorAll('.method').forEach((el, i) => el.classList.toggle('on', (i === 0 ? 'card' : 'crypto') === k)); updateCo(); }
function updateCo() { $('coGo').disabled = !(coMethod && $('coAgree').checked); }
function goPay() {
  const url = coMethod === 'card' ? pending.stripe : pending.crypto;
  if (!url) return;
  window.open(url, '_blank', 'noopener');
  const m = $('coMsg'); m.textContent = 'Finish your payment in the new tab. Your account is added to your dashboard after we confirm the payment.'; m.style.display = 'block';
}

/* ---------- ROUTER ---------- */
let authReady = false;
async function route() {
  const h = location.hash || '#/';
  const app = $('app');
  if (h.startsWith('#/dashboard')) {
    if (!authReady) { app.innerHTML = ''; return; }
    if (!user) { location.hash = '#/'; openAuth(false); return; }
    let page = (h.split('/')[2] || 'accounts');
    if (page === 'overview') page = 'accounts';
    const pg = DPAGES.indexOf(page) >= 0 ? page : 'accounts';
    app.innerHTML = dashShell(pg);
    window.scrollTo(0, 0);
    if (!data.loaded) { $('dbody').innerHTML = '<div class="empty"><p>Loading your data...</p></div>'; await loadData(); }
    $('dbody').innerHTML = dashBody(pg);
    if (pg === 'new') renderPicker('dash');
    if (pg === 'calculator') { calcLot(); calcPl(); }
    return;
  }
  if (h.startsWith('#/checkout')) {
    if (!authReady) { app.innerHTML = ''; return; }
    if (!pending) { location.hash = '#/'; return; }
    if (!user) { location.hash = '#/'; openAuth(true); return; }
    coMethod = '';
    app.innerHTML = checkoutHTML();
    window.scrollTo(0, 0);
    return;
  }
  app.innerHTML = homeHTML();
  renderHdr();
  renderPicker('home');
  window.scrollTo(0, 0);
}
function goSec(id, type) {
  if (type) setType('home', type);
  const el = $(id);
  if (el) el.scrollIntoView({ behavior: 'smooth' });
}
window.addEventListener('hashchange', route);

/* ---------- AUTH ---------- */
function clearMsgs() { $('authError').style.display = 'none'; $('authSuccess').style.display = 'none'; }
function showErr(m) { clearMsgs(); const e = $('authError'); e.textContent = m; e.style.display = 'block'; }
function showOk(m) { clearMsgs(); const e = $('authSuccess'); e.textContent = m; e.style.display = 'block'; }
function needSb() { if (sb) return false; showErr('Sign-in service could not load. Refresh the page and try again.'); return true; }
function setMode(up) {
  isSignUp = up;
  $('authTitle').textContent = up ? 'Create your account' : 'Sign in to your account';
  $('authSub').textContent = up ? 'Sign up once. We will email you a link to confirm your address.' : 'Enter your email and password.';
  $('authSubmit').textContent = up ? 'Create account' : 'Sign in';
  $('passwordInput').autocomplete = up ? 'new-password' : 'current-password';
  $('switchPrefix').textContent = up ? 'Already have an account?' : 'New here?';
  $('switchLink').textContent = up ? 'Sign in' : 'Create your account';
  $('forgotRow').style.display = up ? 'none' : 'flex';
}
function switchMode() { setMode(!isSignUp); clearMsgs(); }
function openAuth(up) { setMode(!!up); clearMsgs(); $('authModal').classList.add('active'); setTimeout(() => $('emailInput').focus(), 50); }
function closeAuth() { $('authModal').classList.remove('active'); clearMsgs(); }

function afterLogin() {
  closeAuth();
  data = { accounts: [], payouts: [], loaded: false };
  if (pending) { renderHdr(); location.hash = '#/checkout'; }
  else if (!(location.hash || '').startsWith('#/dashboard')) location.hash = '#/dashboard';
  else route();
}

async function submitAuth() {
  if (needSb()) return;
  const email = $('emailInput').value.trim(), password = $('passwordInput').value;
  if (!email || !password) { showErr('Enter your email and password.'); return; }
  if (isSignUp && password.length < 6) { showErr('Password must be at least 6 characters.'); return; }
  $('authSubmit').disabled = true;
  try {
    if (isSignUp) {
      const { data: d, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin } });
      if (error) { showErr(error.message); return; }
      if (d.user && d.user.identities && d.user.identities.length === 0) { showErr('This email is already registered. Sign in instead.'); return; }
      if (d.session) { user = d.user; afterLogin(); return; }
      setMode(false);
      showOk('Account created. We sent a confirmation link to ' + email + '. Click it (check spam too), then sign in here.');
    } else {
      const { data: d, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        if (/not confirmed/i.test(error.message)) {
          await sb.auth.resend({ type: 'signup', email, options: { emailRedirectTo: location.origin } });
          showOk('Your email is not confirmed yet. We sent you a new confirmation link.');
        } else showErr(error.message);
        return;
      }
      user = d.user; afterLogin();
    }
  } finally { $('authSubmit').disabled = false; }
}
async function forgotPassword() {
  if (needSb()) return;
  const email = $('emailInput').value.trim();
  if (!email) { showErr('Enter your email above first, then click Forgot password.'); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin });
  if (error) showErr(error.message); else showOk('Password reset link sent to ' + email + '.');
}
async function doSignOut() {
  if (sb) await sb.auth.signOut();
  user = null; data = { accounts: [], payouts: [], loaded: false };
  location.hash = '#/'; route();
}

/* ---------- PAYMENT ---------- */
function checkout(name, stripe, crypto, meta) {
  pending = { name, stripe, crypto, meta: meta || {} };
  if (user) location.hash = '#/checkout'; else openAuth(true);
}
function openPay(name, stripe, crypto) {
  $('payTitle').textContent = name;
  $('stripeBtn').style.display = stripe ? 'flex' : 'none';
  if (stripe) $('stripeBtn').href = stripe;
  $('cryptoBtn').href = crypto;
  $('noCard').style.display = stripe ? 'none' : 'block';
  $('payModal').classList.add('active');
}
function closePay() { $('payModal').classList.remove('active'); }

$('payModal').addEventListener('click', e => { if (e.target === e.currentTarget) closePay(); });
$('authModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeAuth(); });
$('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitAuth(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeAuth(); closePay(); } });

/* ---------- INIT ---------- */
(async function init() {
  if (sb) {
    try {
      const { data: d } = await sb.auth.getSession();
      user = d.session ? d.session.user : null;
    } catch (e) {}
    sb.auth.onAuthStateChange((_ev, session) => {
      const was = user && user.id;
      user = session ? session.user : null;
      if ((user && user.id) !== was) { data = { accounts: [], payouts: [], loaded: false }; }
      renderHdr();
    });
  }
  authReady = true;
  route();
})();
</script>
</body>
</html>

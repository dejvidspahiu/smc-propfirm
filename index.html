<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>SMC Prop Firm | Trade our capital, keep your profits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c1b;--bg2:#0f1228;--card:#141836;--card2:#1a1f45;--bd:#252b58;
  --tx:#eef0ff;--mut:#98a0cb;--p:#7c5cff;--p2:#6a4af0;--soft:rgba(124,92,255,.14);
  --ok:#22d3a6;--warn:#f5b84b;--bad:#ff6b81;--glow:rgba(124,92,255,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,.logo,.num-lg{font-family:'Sora','Manrope',sans-serif}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.ico{width:1.2em;height:1.2em;vertical-align:-.17em;display:inline-block}
.wrap{max-width:1200px;margin:0 auto;padding:0 5%}
.hidden{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:10px;font-weight:700;font-size:.95rem;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .15s,background .15s,border-color .15s}
.btn-p{background:var(--p);color:#fff;box-shadow:0 8px 24px var(--glow)}
.btn-p:hover{background:var(--p2);transform:translateY(-1px)}
.btn-g{background:transparent;color:var(--tx);border-color:var(--bd)}
.btn-g:hover{border-color:var(--p);color:#fff}
.btn-sm{padding:8px 16px;font-size:.85rem;border-radius:8px}
.btn[disabled]{opacity:.6;cursor:wait}

/* promo + header */
.promo{background:linear-gradient(90deg,#4b2fc9,#7c5cff);text-align:center;padding:8px 16px;font-size:.85rem;font-weight:600}
header.site{position:sticky;top:0;z-index:100;background:rgba(10,12,27,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.3rem;text-decoration:none;white-space:nowrap}
.logo em{font-style:normal;color:var(--p)}
.nav{display:flex;gap:28px;list-style:none}
.nav a{text-decoration:none;color:var(--mut);font-weight:600;font-size:.93rem;transition:color .15s}
.nav a:hover{color:#fff}
.hdr-actions{display:flex;align-items:center;gap:12px}
.hdr-user{font-size:.85rem;color:var(--mut);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-btn{background:none;border:none;color:var(--tx);font-weight:700;font-size:.93rem;cursor:pointer}
.link-btn:hover{color:var(--p)}

/* hero */
.hero{padding:84px 0 70px;background:radial-gradient(900px 420px at 80% -10%,rgba(124,92,255,.28),transparent 70%),radial-gradient(600px 300px at 0% 30%,rgba(34,211,166,.08),transparent 70%)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.pill{display:inline-block;background:var(--soft);color:#b9a8ff;font-weight:700;font-size:.82rem;padding:6px 14px;border-radius:999px;margin-bottom:20px;border:1px solid rgba(124,92,255,.35)}
.hero h1{font-size:3.5rem;line-height:1.08;font-weight:800;letter-spacing:-.02em;margin-bottom:20px}
.hero p.lead{color:var(--mut);font-size:1.1rem;max-width:520px;margin-bottom:30px}
.hero .btns{display:flex;gap:12px;flex-wrap:wrap}
.hero-points{display:flex;gap:22px;flex-wrap:wrap;margin-top:30px;color:var(--mut);font-size:.88rem;font-weight:600}
.hero-points span{display:flex;align-items:center;gap:8px}
.hero-points .ico{color:var(--ok)}
.acct-card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--bd);border-radius:20px;padding:26px;box-shadow:0 30px 70px rgba(0,0,0,.45)}
.acct-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.acct-top b{font-size:.95rem}
.tag{font-size:.72rem;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--soft);color:#b9a8ff}
.tag.ok{background:rgba(34,211,166,.14);color:var(--ok)}
.tag.warn{background:rgba(245,184,75,.14);color:var(--warn)}
.tag.bad{background:rgba(255,107,129,.14);color:var(--bad)}
.acct-size{font-family:'Sora';font-size:2.6rem;font-weight:800;margin-bottom:4px}
.acct-sub{color:var(--mut);font-size:.88rem;margin-bottom:22px}
.bar{height:8px;background:#0c0f26;border-radius:99px;overflow:hidden;margin:8px 0 18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--ok));border-radius:99px}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--bd);font-size:.92rem;color:var(--mut)}
.kv b{color:var(--tx)}

/* stats */
.stats{background:var(--bg2);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.stats .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding-top:34px;padding-bottom:34px;text-align:center}
.stats b{display:block;font-family:'Sora';font-size:2rem;font-weight:800}
.stats span{font-size:.88rem;color:var(--mut)}

/* sections */
section.s{padding:90px 0}
section.alt{background:var(--bg2);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.sec-title{text-align:center;max-width:640px;margin:0 auto 46px}
.sec-title h2{font-size:2.4rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.sec-title p{color:var(--mut);margin-top:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px}
.box .ic{width:46px;height:46px;border-radius:12px;background:var(--soft);color:#b9a8ff;display:flex;align-items:center;justify-content:center;margin-bottom:16px;font-size:1.3rem}
.box h3{font-size:1.1rem;margin-bottom:8px}
.box p{color:var(--mut);font-size:.94rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;position:relative}
.step{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:26px}
.step .n{width:38px;height:38px;border-radius:50%;background:var(--p);display:flex;align-items:center;justify-content:center;font-weight:800;margin-bottom:14px}
.step h3{font-size:1.05rem;margin-bottom:6px}
.step p{color:var(--mut);font-size:.9rem}

/* picker */
.picker{max-width:1100px;margin:0 auto}
.prog-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:14px}
.prog{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px 22px;text-align:left;cursor:pointer;color:var(--tx);transition:border-color .15s,background .15s}
.prog:hover{border-color:#4a4f99}
.prog.on{border-color:var(--p);background:linear-gradient(160deg,#1d1f52,#161a40);box-shadow:0 0 0 1px var(--p)}
.prog b{display:block;font-family:'Sora';font-size:1.25rem;margin-bottom:6px}
.prog span{color:var(--mut);font-size:.85rem}
.size-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.size{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 20px;text-align:left;cursor:pointer;color:var(--tx);position:relative;transition:border-color .15s}
.size:hover{border-color:#4a4f99}
.size.on{border-color:var(--p);background:linear-gradient(160deg,#1d1f52,#161a40);box-shadow:0 0 0 1px var(--p)}
.size small{display:block;color:var(--mut);font-size:.78rem;font-weight:600}
.size .big{display:block;font-family:'Sora';font-size:1.9rem;font-weight:800;line-height:1.2;margin:2px 0 8px}
.size .big sup{font-size:.9rem;font-weight:700;margin-right:2px;vertical-align:top;position:relative;top:.35em}
.size .pc{color:var(--ok);font-weight:800;font-size:.95rem}
.size i{position:absolute;top:10px;right:12px;background:var(--ok);color:#06231b;font-size:.62rem;font-style:normal;font-weight:800;padding:2px 7px;border-radius:5px}
.detail{background:linear-gradient(160deg,#161a40,#10132f);border:1px solid var(--bd);border-radius:18px;padding:22px}
.dtools{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:18px;font-weight:600;font-size:.92rem}
.switch{display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--tx);font-weight:700;font-size:.92rem;cursor:pointer}
.switch .tr{width:34px;height:20px;border-radius:99px;background:#3a3f78;position:relative;transition:background .15s}
.switch .tr::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.switch.on .tr{background:var(--p)}
.switch.on .tr::after{transform:translateX(14px)}
.dgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.rbox{background:rgba(8,10,28,.55);border:1px solid var(--bd);border-radius:14px;padding:20px 22px}
.rbox h4{font-size:.88rem;color:var(--mut);font-weight:600;margin-bottom:12px}
.rl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;font-size:.9rem}
.rl span{display:flex;align-items:center;gap:10px;color:var(--mut)}
.rl span .ico{width:1em;height:1em;opacity:.7}
.rl b{font-weight:600;color:var(--tx);text-align:right}
.sumbox{padding:6px 4px 0}
.sumbox h3{font-size:1.1rem;margin-bottom:6px}
.sumbox .pr{font-family:'Sora';font-size:2rem;font-weight:800;color:var(--ok);margin-bottom:16px}
.sumbox .ql{font-size:.78rem;color:var(--mut);font-weight:700;letter-spacing:.04em;margin-bottom:10px}
.sumbox .item{display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:6px 0}
.sumbox .item span{display:flex;align-items:center;gap:10px}
.sumbox .item .ico{color:var(--ok)}
.sumbox .btn{width:100%;margin:16px 0 14px;padding:15px}
.sumbox .code{font-size:.82rem;color:var(--mut);margin-bottom:14px}
.sumbox .code b{color:#b9a8ff}
.pays{display:flex;gap:8px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--bd)}
.pays span{background:#1d2150;border-radius:6px;padding:6px 10px;font-size:.78rem;font-weight:700;color:var(--mut)}
@media(max-width:1000px){.dgrid{grid-template-columns:1fr 1fr}.sumbox{grid-column:1/-1}.size-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.dgrid{grid-template-columns:1fr}.size .big{font-size:1.5rem}}

/* compare table */
.cmp{max-width:820px;margin:0 auto;border:1px solid var(--bd);border-radius:16px;overflow:hidden;background:var(--card)}
.cmp .r{display:grid;grid-template-columns:1.2fr 1fr 1fr;padding:14px 22px;border-top:1px solid var(--bd);font-size:.94rem}
.cmp .r:first-child{border-top:none;background:var(--card2);font-weight:800}
.cmp .r span:first-child{color:var(--mut)}
.cmp-scroll{overflow-x:auto}

/* faq */
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px 22px;margin-bottom:12px}
summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';color:var(--p);font-size:1.3rem;line-height:1}
details[open] summary::after{content:'\2212'}
details p{color:var(--mut);margin-top:12px;font-size:.94rem}

/* cta + footer */
.cta{background:linear-gradient(135deg,#3a24a8,#7c5cff);border-radius:24px;padding:56px 28px;text-align:center}
.cta h2{font-size:2.2rem;font-weight:800;margin-bottom:10px}
.cta p{opacity:.85;margin-bottom:24px}
.cta .btn{background:#fff;color:#2b1a85}
footer.site{border-top:1px solid var(--bd);padding:44px 0;color:var(--mut);font-size:.85rem}
footer.site .wrap{display:flex;flex-direction:column;gap:14px}
.foot-links{display:flex;gap:22px;flex-wrap:wrap}
.foot-links a{text-decoration:none}
.foot-links a:hover{color:#fff}
.risk{font-size:.78rem;opacity:.75;max-width:900px}

/* auth + payment modals */
.overlay{position:fixed;inset:0;background:rgba(5,6,16,.72);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
.overlay.active{display:flex}
.modal{background:var(--card);border:1px solid var(--bd);border-radius:20px;width:100%;max-width:420px;padding:32px;position:relative;max-height:92vh;overflow-y:auto}
.modal .x{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--mut);cursor:pointer;font-size:1.2rem}
.modal h3{font-size:1.4rem;margin-bottom:6px}
.modal .sub{color:var(--mut);font-size:.9rem;margin-bottom:20px}
.field{margin-bottom:14px;text-align:left}
.field label{display:block;font-size:.82rem;font-weight:700;margin-bottom:6px;color:var(--mut)}
.in{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:.95rem;font-family:inherit;outline:none}
.in:focus{border-color:var(--p)}
.msg{display:none;padding:10px 14px;border-radius:8px;font-size:.86rem;margin-bottom:14px;text-align:left}
.msg.err{background:rgba(255,107,129,.12);color:var(--bad)}
.msg.okm{background:rgba(34,211,166,.12);color:var(--ok)}
.auth-row{display:flex;justify-content:flex-end;margin-bottom:16px}
.auth-row a{color:#b9a8ff;font-size:.85rem;font-weight:600;cursor:pointer;text-decoration:none}
.auth-switch{text-align:center;margin-top:20px;font-size:.9rem;color:var(--mut)}
.auth-switch a{color:#b9a8ff;font-weight:700;cursor:pointer;text-decoration:none}
.pay{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;text-decoration:none;font-weight:700;margin-top:12px}
.pay:hover{border-color:var(--p)}

/* dashboard */
.dash{display:grid;grid-template-columns:250px 1fr;min-height:100vh;background:var(--bg)}
.side{background:var(--bg2);border-right:1px solid var(--bd);padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.side .logo{padding:4px 10px 22px}
.side a.nl{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:var(--mut);text-decoration:none;font-weight:600;font-size:.93rem}
.side a.nl:hover{background:var(--card);color:#fff}
.side a.nl.on{background:var(--soft);color:#fff}
.side a.nl.on .ico{color:var(--p)}
.side .grow{flex:1}
.dmain{padding:28px 34px 60px;min-width:0}
.dtop{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}
.dtop h1{font-size:1.7rem;font-weight:800}
.dtop .sub{color:var(--mut);font-size:.92rem}
.menu-btn{display:none;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:9px 12px;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
.kpi span{color:var(--mut);font-size:.84rem;font-weight:600}
.kpi b{display:block;font-family:'Sora';font-size:1.8rem;margin-top:4px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:24px;margin-bottom:22px}
.panel h2{font-size:1.1rem;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.empty{text-align:center;padding:38px 16px;color:var(--mut)}
.empty .ei{width:54px;height:54px;border-radius:16px;background:var(--soft);color:#b9a8ff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:1.5rem}
.empty h3{color:var(--tx);font-size:1.05rem;margin-bottom:6px}
.empty p{font-size:.9rem;max-width:380px;margin:0 auto 18px}
.accts{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;color:var(--mut);font-weight:700;font-size:.8rem;padding:10px 12px;border-bottom:1px solid var(--bd)}
.tbl td{padding:13px 12px;border-bottom:1px solid var(--bd)}
.tbl-wrap{overflow-x:auto}
.rule-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.rule{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:18px}
.rule b{display:block;font-family:'Sora';font-size:1.5rem;margin-bottom:2px}
.rule span{color:var(--mut);font-size:.85rem}
.scrim{display:none}

@media(max-width:960px){
  .hero .wrap{grid-template-columns:1fr}
  .hero h1{font-size:2.6rem}
  .steps{grid-template-columns:repeat(2,1fr)}
  .nav{display:none}
}
@media(max-width:820px){
  .dash{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:900;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:850}
  .menu-btn{display:inline-block}
  .dmain{padding:20px 16px 50px}
}
@media(max-width:640px){
  .stats .wrap{grid-template-columns:repeat(2,1fr)}
  .sel{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  .sec-title h2{font-size:1.8rem}
  .cmp .r{padding:12px 14px;font-size:.85rem}
  .hdr-user{display:none}
  section.s{padding:60px 0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

}
const newBtn = '<a class="btn btn-p btn-sm" href="#/dashboard/new">Buy a challenge</a>';

function dashBody(page) {
  const act = data.accounts.filter(a => a.status === 'active' || a.status === 'passed').length;
  const fund = data.accounts.filter(a => a.status === 'funded').length;
  const paid = data.payouts.filter(p => p.status === 'paid').reduce((s, p) => s + Number(p.amount || 0), 0);
  if (page === 'overview') {
    return '<div class="kpis"><div class="kpi"><span>Accounts</span><b>' + data.accounts.length + '</b></div><div class="kpi"><span>In evaluation</span><b>' + act + '</b></div><div class="kpi"><span>Funded</span><b>' + fund + '</b></div><div class="kpi"><span>Total paid out</span><b>' + money(paid) + '</b></div></div>' +
      '<div class="panel"><h2>Your accounts <a class="btn btn-g btn-sm" href="#/dashboard/accounts">View all</a></h2>' +
      (data.accounts.length ? '<div class="accts">' + data.accounts.slice(0, 3).map(acctCard).join('') + '</div>' : emptyBlock('wallet', 'No accounts yet', 'Buy a challenge or an instant account and it will show up here.', newBtn)) + '</div>' +
      '<div class="panel"><h2>Recent payouts <a class="btn btn-g btn-sm" href="#/dashboard/payouts">View all</a></h2>' + payoutTable() + '</div>';
  }
  if (page === 'accounts') {
    return '<div class="panel">' + (data.accounts.length ? '<div class="accts">' + data.accounts.map(acctCard).join('') + '</div>' : emptyBlock('wallet', 'No accounts yet', 'Buy a challenge or an instant account and it will show up here.', newBtn)) + '</div>';
  }
  if (page === 'new') return pickerHTML('dash');
  if (page === 'payouts') return payoutForm() + '<div class="panel"><h2>Payout history</h2>' + payoutTable() + '</div>';
  if (page === 'rules') {
    return '<div class="panel"><h2>Loss limits (all accounts)</h2><div class="rule-grid"><div class="rule"><b>5%</b><span>Daily loss limit</span></div><div class="rule"><b>10%</b><span>Max loss limit</span></div></div></div>' +
      '<div class="panel"><h2>Evaluation Challenge</h2><div class="rule-grid"><div class="rule"><b>8%</b><span>Phase 1 profit target</span></div><div class="rule"><b>5%</b><span>Phase 2 profit target</span></div><div class="rule"><b>cTrader</b><span>Platform</span></div></div></div>' +
      '<div class="panel"><h2>Instant Funding</h2><div class="rule-grid"><div class="rule"><b>None</b><span>Evaluation</span></div><div class="rule"><b>80%</b><span>Profit split</span></div><div class="rule"><b>cTrader</b><span>Platform</span></div></div></div>';
  }
  if (page === 'settings') {
    return '<div class="panel" style="max-width:520px"><h2>Login details</h2>' +
      '<div class="field"><label>Email address</label><input class="in" value="' + esc(user.email) + '" disabled></div>' +
      '<div class="msg err" id="pwErr"></div><div class="msg okm" id="pwOk"></div>' +
      '<div class="field"><label for="newPw">New password</label><input type="password" id="newPw" class="in" placeholder="At least 6 characters" autocomplete="new-password"></div>' +
      '<button class="btn btn-p btn-sm" onclick="changePw()">Update password</button></div>';
  }
  return '';
}


function payoutForm() {
  const funded = data.accounts.filter(a => a.status === 'funded');
  if (!funded.length) return '<div class="panel"><h2>Request a payout</h2>' + emptyBlock('cash', 'No funded account yet', 'You can request a payout once one of your accounts is funded.') + '</div>';
  return '<div class="panel" style="max-width:560px"><h2>Request a payout</h2>' +
    '<div class="msg err" id="poErr"></div><div class="msg okm" id="poOk"></div>' +
    '<div class="field"><label for="poAcct">Funded account</label><select id="poAcct" class="in">' + funded.map(a => '<option value="' + esc(a.id) + '">' + money(a.size) + ' &middot; balance ' + money(a.balance) + '</option>').join('') + '</select></div>' +
    '<div class="field"><label for="poAmt">Amount (USD)</label><input id="poAmt" type="number" min="1" step="0.01" class="in" placeholder="0.00"></div>' +
    '<div class="field"><label for="poMethod">Method</label><select id="poMethod" class="in"><option>Crypto (USDT TRC20)</option><option>Bank transfer</option></select></div>' +
    '<div class="field"><label for="poDet">Wallet address or bank details</label><textarea id="poDet" class="in" rows="3" placeholder="Where should we send it?"></textarea></div>' +
    '<button class="btn btn-p btn-sm" id="poBtn" onclick="requestPayout()">Send request</button></div>';
}
async function requestPayout() {
  const er = $('poErr'), ok = $('poOk');
  er.style.display = ok.style.display = 'none';
  const amount = parseFloat($('poAmt').value), det = $('poDet').value.trim();
  if (!(amount > 0)) { er.textContent = 'Enter an amount greater than 0.'; er.style.display = 'block'; return; }
  if (!det) { er.textContent = 'Enter your wallet address or bank details.'; er.style.display = 'block'; return; }
  $('poBtn').disabled = true;
  const { error } = await sb.from('payouts').insert({ user_id: user.id, account_id: $('poAcct').value, amount, method: $('poMethod').value, details: det, status: 'pending' });
  $('poBtn').disabled = false;
  if (error) { er.textContent = 'Could not send the request: ' + error.message; er.style.display = 'block'; return; }
  data.loaded = false; await loadData(); data.loaded = true;
  $('dbody').innerHTML = dashBody('payouts');
  $('poOk') && ($('poOk').textContent = 'Request sent. We will review it soon.', $('poOk').style.display = 'block');
}

async function loadData() {
  data = { accounts: [], payouts: [], loaded: true };
  if (!sb || !user) return;
  try {
    const a = await sb.from('accounts').select('*').eq('user_id', user.id).order('created_at', { ascending: false });
    if (!a.error && a.data) data.accounts = a.data;
  } catch (e) {}
  try {
    const p = await sb.from('payouts').select('*').eq('user_id', user.id).order('created_at', { ascending: false });
    if (!p.error && p.data) data.payouts = p.data;
  } catch (e) {}
}

async function changePw() {
  const pw = $('newPw').value, er = $('pwErr'), ok = $('pwOk');
  er.style.display = ok.style.display = 'none';
  if (pw.length < 6) { er.textContent = 'Password must be at least 6 characters.'; er.style.display = 'block'; return; }
  const { error } = await sb.auth.updateUser({ password: pw });
  if (error) { er.textContent = error.message; er.style.display = 'block'; }
  else { ok.textContent = 'Password updated.'; ok.style.display = 'block'; $('newPw').value = ''; }
}

/* ---------- ROUTER ---------- */
let authReady = false;
async function route() {
  const h = location.hash || '#/';
  const app = $('app');
  if (h.startsWith('#/dashboard')) {
    if (!authReady) { app.innerHTML = ''; return; }
    if (!user) { location.hash = '#/'; openAuth(false); return; }
    const page = (h.split('/')[2] || 'overview');
    const pg = DTITLE[page] ? page : 'overview';
    app.innerHTML = dashShell(pg);
    window.scrollTo(0, 0);
    if (!data.loaded) { $('dbody').innerHTML = '<div class="panel"><div class="empty"><p>Loading your data...</p></div></div>'; await loadData(); }
    $('dbody').innerHTML = dashBody(pg);
    if (pg === 'new') renderPicker('dash');
    return;
  }
  app.innerHTML = homeHTML();
  renderHdr();
  renderPicker('home');
  window.scrollTo(0, 0);
}
function goSec(id, type) {
  if (type) setType('home', type);
  const el = $(id);
  if (el) el.scrollIntoView({ behavior: 'smooth' });
}
window.addEventListener('hashchange', route);

/* ---------- AUTH ---------- */
function clearMsgs() { $('authError').style.display = 'none'; $('authSuccess').style.display = 'none'; }
function showErr(m) { clearMsgs(); const e = $('authError'); e.textContent = m; e.style.display = 'block'; }
function showOk(m) { clearMsgs(); const e = $('authSuccess'); e.textContent = m; e.style.display = 'block'; }
function needSb() { if (sb) return false; showErr('Sign-in service could not load. Refresh the page and try again.'); return true; }
function setMode(up) {
  isSignUp = up;
  $('authTitle').textContent = up ? 'Create your account' : 'Sign in to your account';
  $('authSub').textContent = up ? 'Sign up once. We will email you a link to confirm your address.' : 'Enter your email and password.';
  $('authSubmit').textContent = up ? 'Create account' : 'Sign in';
  $('passwordInput').autocomplete = up ? 'new-password' : 'current-password';
  $('switchPrefix').textContent = up ? 'Already have an account?' : 'New here?';
  $('switchLink').textContent = up ? 'Sign in' : 'Create your account';
  $('forgotRow').style.display = up ? 'none' : 'flex';
}
function switchMode() { setMode(!isSignUp); clearMsgs(); }
function openAuth(up) { setMode(!!up); clearMsgs(); $('authModal').classList.add('active'); setTimeout(() => $('emailInput').focus(), 50); }
function closeAuth() { $('authModal').classList.remove('active'); clearMsgs(); }

function afterLogin() {
  closeAuth();
  data = { accounts: [], payouts: [], loaded: false };
  if (pending) { openPay(pending.name, pending.stripe, pending.crypto); renderHdr(); }
  else if (!(location.hash || '').startsWith('#/dashboard')) location.hash = '#/dashboard';
  else route();
}

async function submitAuth() {
  if (needSb()) return;
  const email = $('emailInput').value.trim(), password = $('passwordInput').value;
  if (!email || !password) { showErr('Enter your email and password.'); return; }
  if (isSignUp && password.length < 6) { showErr('Password must be at least 6 characters.'); return; }
  $('authSubmit').disabled = true;
  try {
    if (isSignUp) {
      const { data: d, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin } });
      if (error) { showErr(error.message); return; }
      if (d.user && d.user.identities && d.user.identities.length === 0) { showErr('This email is already registered. Sign in instead.'); return; }
      if (d.session) { user = d.user; afterLogin(); return; }
      setMode(false);
      showOk('Account created. We sent a confirmation link to ' + email + '. Click it (check spam too), then sign in here.');
    } else {
      const { data: d, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        if (/not confirmed/i.test(error.message)) {
          await sb.auth.resend({ type: 'signup', email, options: { emailRedirectTo: location.origin } });
          showOk('Your email is not confirmed yet. We sent you a new confirmation link.');
        } else showErr(error.message);
        return;
      }
      user = d.user; afterLogin();
    }
  } finally { $('authSubmit').disabled = false; }
}
async function forgotPassword() {
  if (needSb()) return;
  const email = $('emailInput').value.trim();
  if (!email) { showErr('Enter your email above first, then click Forgot password.'); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin });
  if (error) showErr(error.message); else showOk('Password reset link sent to ' + email + '.');
}
async function doSignOut() {
  if (sb) await sb.auth.signOut();
  user = null; data = { accounts: [], payouts: [], loaded: false };
  location.hash = '#/'; route();
}

/* ---------- PAYMENT ---------- */
function checkout(name, stripe, crypto) {
  pending = { name, stripe, crypto };
  if (user) openPay(name, stripe, crypto); else openAuth(true);
}
function openPay(name, stripe, crypto) {
  $('payTitle').textContent = name;
  $('stripeBtn').style.display = stripe ? 'flex' : 'none';
  if (stripe) $('stripeBtn').href = stripe;
  $('cryptoBtn').href = crypto;
  $('noCard').style.display = stripe ? 'none' : 'block';
  $('payModal').classList.add('active');
}
function closePay() { $('payModal').classList.remove('active'); }

$('payModal').addEventListener('click', e => { if (e.target === e.currentTarget) closePay(); });
$('authModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeAuth(); });
$('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitAuth(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeAuth(); closePay(); } });

/* ---------- INIT ---------- */
(async function init() {
  if (sb) {
    try {
      const { data: d } = await sb.auth.getSession();
      user = d.session ? d.session.user : null;
    } catch (e) {}
    sb.auth.onAuthStateChange((_ev, session) => {
      const was = user && user.id;
      user = session ? session.user : null;
      if ((user && user.id) !== was) { data = { accounts: [], payouts: [], loaded: false }; }
      renderHdr();
    });
  }
  authReady = true;
  route();
})();
</script>
</body>
</html>
